name: Juju 4.x Integration Tests

on:
  workflow_dispatch:

  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration tests (Juju 4.x)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (Concierge with Juju 4.x)
        shell: bash
        run: |
          set -euo pipefail

          sudo snap install concierge --classic

          sudo -E concierge prepare \
            -p k8s \
            --juju-channel=4/edge \
            --extra-snaps=astral-uv,just

          mkdir -p ~/.kube
          sudo k8s kubectl config view --raw > ~/.kube/config

          uv tool install tox

      - name: Verify Juju version
        run: juju version

      - name: Run integration tests
        run: just integration

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state

