name: Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          uv tool install tox

          sudo snap install just --classic

      - name: Run lint
        run: just lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          uv tool install tox

          sudo snap install just --classic

      - name: Run unit tests
        run: just unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (concierge)
        shell: bash
        run: |
          set -euo pipefail
          
          sudo apt-get update
          sudo apt-get purge -y $(dpkg -l | grep -i docker | awk '{print $2}') || true
          sudo apt-get purge -y containerd.io || true
          sudo rm -rf /run/containerd || true

          sudo snap install concierge --classic

          sudo -E concierge prepare -p k8s --extra-snaps=astral-uv,just

          mkdir -p ~/.kube
          sudo k8s kubectl config view --raw > ~/.kube/config

          uv tool install tox

      - name: Run integration tests
        run: just integration

      - name: Print juju status on failure
        if: failure()
        run: |
          juju status --relations
          juju debug-log --replay --level DEBUG | tail -200
