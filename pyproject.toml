[project]
name = "nifi-k8s-operator"
version = "0.0"
requires-python = ">=3.12"

dependencies = [
    "ops>=3,<4",
    "Jinja2>=3.1",
]

[dependency-groups]
lint = ["ruff", "codespell"]
format = ["ruff"]
unit = ["coverage[toml]", "ops[testing]", "pytest"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--tb=native --verbose --capture=no --log-cli-level=INFO"

[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
extend-exclude = ["__pycache__", "*.egg_info"]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104","D205"]}

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[tool.pyright]
include = ["src", "tests"]
