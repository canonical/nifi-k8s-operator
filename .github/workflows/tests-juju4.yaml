name: Juju 4.x Integration Tests

on:
  workflow_dispatch:

  # push:
  #   branches:
  #     - add-juju-4-integration-tests
  #   paths-ignore:
  #     - '**.md'

  # schedule:
  #   - cron: '0 5 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration tests (Juju 4.x)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (Concierge with Juju 4.x)
        shell: bash
        run: |
          set -euo pipefail

          sudo snap install concierge --classic

          sudo -E concierge prepare \
            -p k8s \
            --juju-channel=4/edge \
            --extra-snaps=astral-uv,just

          mkdir -p ~/.kube
          sudo k8s kubectl config view --raw > ~/.kube/config

          uv tool install tox

      - name: Verify Juju version
        run: juju version

      - name: Run integration tests
        run: just integration

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=== Juju version ==="
          juju version

          echo "=== Juju controllers ==="
          juju controllers

          echo "=== Juju models ==="
          juju models

          echo "=== Juju status ==="
          juju status --model test --relations --storage

          echo "=== Kubernetes status ==="
          sudo k8s status

          echo "=== Kubernetes pods ==="
          sudo k8s kubectl get pods -A -o wide

          echo "=== Persistent volume claims ==="
          sudo k8s kubectl get pvc -A

          echo "=== Persistent volumes ==="
          sudo k8s kubectl get pv

          echo "=== Storage classes ==="
          sudo k8s kubectl get storageclass

          echo "=== Recent Kubernetes events ==="
          sudo k8s kubectl get events -A \
            --sort-by=.metadata.creationTimestamp