type: charm
name: nifi-k8s
title: Apache NiFi
summary: A Juju charm for deploying Apache NiFi on Kubernetes
description: |
  A Juju charm for deploying and managing Apache NiFi 2.x on Kubernetes.
  Apache NiFi is a data logistics platform for automating the movement
  and transformation of data between systems.

links:
  contact: Workflows Team <workflows-charmers@canonical.com>
  issues:
    - https://github.com/canonical/nifi-k8s-operator/issues
  source:
    - https://github.com/canonical/nifi-k8s-operator

base: ubuntu@26.04
platforms:
  amd64:

charm-user: non-root

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
  files:
    plugin: dump
    source: .
    stage:
      - LICENSE

containers:
  nifi:
    resource: nifi-image
    uid: 584792
    gid: 584792
    mounts:
      - storage: nifi-data
        location: /var/lib/nifi/data
      - storage: content-repo
        location: /var/lib/nifi/content_repository
      - storage: provenance-repo
        location: /var/lib/nifi/provenance_repository

resources:
  nifi-image:
    type: oci-image
    description: Canonical Apache NiFi rock
    # Temporary non-root rebuild pending canonical/nifi-rocks#3; revert to
    # ghcr.io/canonical/nifi-rocks/nifi:2.10 once the non-root rock is published.
    upstream-source: docker.io/edeusebio85/nifi:2.10-nonroot

storage:
  nifi-data:
    type: filesystem
    minimum-size: 10G
  content-repo:
    type: filesystem
    minimum-size: 20G
  provenance-repo:
    type: filesystem
    minimum-size: 20G

requires:
  git-registry:
    interface: git
    optional: true
    limit: 1
  ingress:
    interface: ingress
    optional: true
    limit: 1

config:
  options:
    sensitive-props-key:
      type: secret
      description: |
        Juju user secret containing the NiFi sensitive properties key used to
        encrypt passwords stored in flow definitions (nifi.sensitive.props.key).
        The secret must expose the key in a field named "sensitive-props-key"
        and the value must be at least 12 characters long (32 recommended).

        Usage:
          juju add-secret nifi-sensitive-key sensitive-props-key=<random-32-chars>
          juju grant-secret nifi-sensitive-key nifi-k8s
          juju config nifi-k8s sensitive-props-key=<secret-id>

        The charm remains in BlockedStatus until this secret is configured.
